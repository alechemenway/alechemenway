<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Design score card for julius.fm — Grade A, 94 out of 100">
  <defs>
    <radialGradient id="glow" cx="84%" cy="8%" r="72%">
      <stop offset="0%" stop-color="#0000ee" stop-opacity="0.12"/>
      <stop offset="52%" stop-color="#0000ee" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0000ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f7f7f7"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="20" y="20" width="1160" height="590" rx="24" fill="none" stroke="#121212" stroke-opacity="0.12"/>

  <!-- eyebrow -->
  <text x="72" y="104" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="5" fill="#0000ee">DESIGN&#160;LANGUAGE</text>

  <!-- title + subtitle -->
  <text x="70" y="196" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-2" fill="#121212">julius.fm</text>
  <text x="72" y="244" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#767676">Designer living in Berlin</text>

  <!-- grade block: flat white card, 24px radius, soft shadow -->
  <rect x="968" y="78" width="164" height="176" rx="24" fill="#ffffff" stroke="#121212" stroke-opacity="0.12" filter="url(#soft)"/>
  <text x="1050" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#767676">GRADE</text>
  <text x="1050" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="800" fill="#0000ee">A</text>
  <text x="1050" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#121212">94 / 100</text>

  <!-- palette -->
  <text x="72" y="336" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#767676">PALETTE</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#767676">
    <rect x="72"  y="356" width="168" height="72" rx="12" fill="#0000ee"/>
    <text x="82"  y="452">#0000ee</text>
    <rect x="252" y="356" width="168" height="72" rx="12" fill="#121212"/>
    <text x="262" y="452">#121212</text>
    <rect x="432" y="356" width="168" height="72" rx="12" fill="#000000"/>
    <text x="442" y="452">#000000</text>
    <rect x="612" y="356" width="168" height="72" rx="12" fill="#767676"/>
    <text x="622" y="452">#767676</text>
    <rect x="792" y="356" width="168" height="72" rx="12" fill="#9a9a9a"/>
    <text x="802" y="452">#9a9a9a</text>
    <rect x="972" y="356" width="156" height="72" rx="12" fill="#ffffff" stroke="#121212" stroke-opacity="0.15"/>
    <text x="982" y="452">#ffffff</text>
  </g>

  <!-- footer stats -->
  <line x1="72" y1="512" x2="1128" y2="512" stroke="#121212" stroke-opacity="0.12"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="24">
    <text x="72"  y="560" fill="#121212" font-weight="700">Arial</text>
    <text x="152" y="560" fill="#767676">· Caveat</text>
    <text x="1128" y="560" text-anchor="end" fill="#121212" font-weight="700">WCAG 100%<tspan fill="#767676" font-weight="400">  ·  492 elements</tspan></text>
  </g>
  <text x="72" y="600" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.5" fill="#9a9a9a">measured by designlang · 2026-09-02</text>
</svg>
